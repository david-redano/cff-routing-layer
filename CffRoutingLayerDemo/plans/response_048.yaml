    - RepeatAcceptancePercentage
    - UniqueCustomers
    - CustomersWithRepeatAcceptance
    - TotalQuotes
    - PeriodFrom
    - PeriodTo
    - PeriodLabel
defaultEntities:
  companyId: DEMO-001
  dateFrom: "2026-01-01"
  dateTo: "2026-03-31"
sampleQueries:
  - "Calculate the percentage of customers who received a quote ${period} and then accepted another quote in the same quarter"
  - "Percentage of customers who received a quote ${period} and then accepted another?"
steps:
