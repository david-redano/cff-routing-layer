planId: real-035
intent: RetrieveDetailsSpecificSalesOrder
agentId: SalesAgent
domain: sales
displayName: Sales Agent
capabilities:
  - sales-orders
  - sales-get-order
understanding: "User wants to retrieve details for a specific sales order identified by order ${orderId}"
expectedData:
  summary:
    - OrderNumber
    - CustomerName
    - OrderDate
    - Status
    - TotalAmount
    - Currency
    - LineItemCount
defaultEntities:
  companyId: DEMO-001
  dateFrom: "2025-06-01"
  dateTo: "2026-06-01"
sampleQueries:
  - "User wants to retrieve details for a specific sales order identified by order ${orderId}"
  - "User wants to retrieve details for a specific sales order identified by order?"
steps:
  - id: 1
    action: sales-list-sales-orders
    stepType: Tool
    toolName: sales_list_sales_orders
    toolId: "38de4b32-92d4-de8f-4d9b-40d61c39b7c6"
    stepReason: "Search for sales order 0003"
    dependsOn: []
    outputFields: [orders]
    input:
      - key: date_from
        value: "2025-06-01"
      - key: date_to
        value: "2026-06-01"
      - key: page_size
        value: "200"
    nextStep: 2
  - id: 2
    action: compute-validate-and-extract-order-id
    stepType: Code
    functionName: validateOrder
    stepReason: "Validate and extract order ID"
    dependsOn: [1]
    outputFields: [step2Result]
    nextStep: 3
  - id: 3
    action: sales-get-sales-order
    stepType: Tool
    toolName: sales_get_sales_order
    toolId: "bb53c0b2-0434-0479-4f19-6756b0002ab3"
    stepReason: "Fetch full sales order details"
    dependsOn: [2]
    outputFields: [order]
    input:
      - key: sales_order_id
        value: "$.Step2.OrderId"
    nextStep: 4
  - id: 4
    action: compute-build-order-summary-and-line-items-table
    stepType: Code
    functionName: buildOutput
    stepReason: "Build order summary and line items table"
    dependsOn: [3]
