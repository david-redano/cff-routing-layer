planId: invoice-001
intent: CreateInvoice
agentId: InvoiceAgent
domain: finance
displayName: Invoice Agent
description: "Create an invoice for a customer with a given amount"
capabilities:
  - invoicing
  - billing
understanding: "Create and send an invoice to a customer for services or goods with tax applied"
expectedData:
  summary:
    - InvoiceId
    - Customer
    - Amount
    - TaxAmount
    - Status
defaultEntities:
  companyId: DEMO-001
sampleQueries:
  - "Create an invoice for TechVentures LLC for $4,500"
  - "Bill TechVentures LLC $4,500 for consulting"
  - "Issue invoice to TechVentures for four thousand five hundred dollars"
  - "I need to invoice a customer for services"
steps:
  - id: 1
    action: validate-customer
    dependsOn: []
    outputFields: [customerId, customerName]
  - id: 2
    action: create-invoice-record
    dependsOn: [1]
    outputFields: [invoiceId, amount]
  - id: 3
    action: apply-tax
    dependsOn: [2]
    outputFields: [taxAmount, totalAmount]
  - id: 4
    action: send-invoice
    dependsOn: [3]
    outputFields: [status]
