planId: tax-001
intent: EstimateTaxLiability
agentId: TaxAgent
domain: finance
displayName: Tax Agent
description: "Estimate tax liability for a given year and entity type"
capabilities:
  - tax
  - compliance
understanding: "Estimate the tax liability for a given year and entity type based on taxable income after deductions"
expectedData:
  summary:
    - TaxableIncome
    - Deductions
    - TaxLiability
    - EffectiveRate
    - Year
defaultEntities:
  year: "2024"
  entityType: S-Corp
  companyId: DEMO-001
sampleQueries:
  - "Estimate tax liability for Q2 2024 for Acme Corp S-Corp"
  - "How much tax do we owe for 2024?"
  - "Calculate our tax liability for this year"
  - "What's the estimated tax for an LLC in 2024?"
  - "What's our tax situation for this year?"
  - "What is our tax exposure for 2024?"
  - "How much do we owe in taxes?"
steps:
  - id: 1
    action: fetch-taxable-income
    dependsOn: []
    outputFields: [taxableIncome]
  - id: 2
    action: apply-deductions
    dependsOn: [1]
    outputFields: [deductions, adjustedIncome]
  - id: 3
    action: compute-tax-liability
    dependsOn: [2]
    outputFields: [taxLiability, effectiveRate]
  - id: 4
    action: generate-tax-estimate-report
    dependsOn: [3]
    outputFields: [report]
