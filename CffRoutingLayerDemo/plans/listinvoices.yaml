# ListInvoices Plan
planId: listinvoices-001
intent: ListInvoices
agentId: InvoiceAgent
domain: finance
displayName: Invoice Agent
description: "List all invoices for the user or a specified customer, period, or status"
capabilities:
  - invoicing
  - billing
understanding: "List all outstanding or historical invoices optionally filtered by customer, date period, or payment status"
expectedData:
  summary:
    - InvoiceCount
    - TotalAmount
    - Currency
defaultEntities:
  companyId: DEMO-001
sampleQueries:
  - "list my invoices"
  - "show all invoices for last month"
  - "get invoice history"
  - "display invoices for Acme Corp"
  - "what invoices are outstanding?"
steps:
  - id: 1
    action: fetch-invoices
    dependsOn: []
    outputFields: [invoices, invoiceCount]
  - id: 2
    action: render-invoice-list
    dependsOn: [1]
    outputFields: [report]
