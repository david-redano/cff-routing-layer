planId: real-045
intent: ShowTotalSalesInvoicesIssued
agentId: SalesAgent
domain: sales
displayName: Sales Agent
capabilities:
  - sales-invoices
understanding: "Show the total amount of sales invoices issued ${period} that have already been collected (paid)"
description: "Fetch all sales invoices issued in the prior calendar month (May ${year}, since TodaysDate = ${date}) with status 'paid' , sum the total_amount , and return as Text Summary with the aggregated metric"
expectedData:
  summary:
    - TotalCollected
    - InvoiceCount
    - Currency
defaultEntities:
  companyId: DEMO-001
  dateFrom: "2026-05-01"
  dateTo: "2026-05-31"
sampleQueries:
  - "Show the total amount of sales invoices issued ${period} that have already been collected (paid)"
  - "Total amount of sales invoices issued ${period} that have already been collected?"
steps:
  - id: 1
    action: sales-list-sales-invoices
    stepType: Tool
    toolName: sales_list_sales_invoices
    toolId: "f5fc423c-2544-084c-56df-09d849ac1737"
    stepReason: "Fetch paid invoices from last month"
    dependsOn: []
    outputFields: [invoices]
    input:
      - key: status
        value: "Paid"
      - key: date_from
        value: "2026-05-01"
      - key: date_to
        value: "2026-05-31"
      - key: page_size
        value: "200"
    nextStep: 2
  - id: 2
    action: compute-sum-collected-amounts-and-build-output
    stepType: Code
    functionName: buildOutput
    stepReason: "Sum collected amounts and build output"
    dependsOn: [1]
    outputFields: [totalCollected, invoiceCount, currency]
