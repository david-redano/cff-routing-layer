    input:
      - key: status
        value: "Paid"
      - key: date_from
        value: "2025-01-01"
      - key: date_to
        value: "2026-12-31"
      - key: page_size
        value: "200"
    nextStep: 2
  - id: 2
    action: compute-rank-customers-by-on-time-payment-consistency
    stepType: Code
    functionName: buildOutput
    stepReason: "Rank customers by on-time payment consistency"
    dependsOn: [1]
