planId: real-042
intent: IdentifyCustomersRankedPaymentPunctuality
agentId: SalesAgent
domain: sales
displayName: Sales Agent
capabilities:
  - sales-invoices
understanding: "Identify the top customers ranked by their payment punctuality — those who consistently pay invoices by the due date"
description: "Fetch all sales invoices with a broad date range (${period}), then filter to paid invoices, calculate days-to-pay for each (payment_date minus due_date), identify customers with zero or negative days-to-pay (on-time or early), rank by payment consistency (count of on-time payments), and return as BarChart+Table showing top customers by on-time payment count with supporting detail"
expectedData:
  summary:
    - TotalCustomers
    - TopCustomersDisplayed
    - OnTimePaymentRate
    - Currency
defaultEntities:
  companyId: DEMO-001
  dateFrom: "2025-01-01"
  dateTo: "2026-12-31"
sampleQueries:
  - "Identify the top customers ranked by their payment punctuality — those who consistently pay invoices by the due date"
  - "Top customers ranked by their payment punctuality — those who consistently pay?"
steps:
